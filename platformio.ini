; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; ── Selective compile ─────────────────────────────────────────────────────────
; Only the two features this project uses are compiled in.
; Every omitted flag (ENABLE_DATABASE, ENABLE_STORAGE, etc.) saves flash space.
build_flags =
    -D ENABLE_FIRESTORE
    -D ENABLE_USER_AUTH

lib_deps =
    mobizt/FirebaseClient @ ^2.2.9
    bblanchon/ArduinoJson  @ ^7.2.2